<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mizantra ERP Offline</title>
    <meta name="theme-color" content="#8B6F47" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf9f6;
        color: #4a3426;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(92vw, 28rem);
        border: 1px solid #e8dcc4;
        background: white;
        padding: 1.5rem;
        border-radius: .5rem;
        box-shadow: 0 10px 30px rgba(74, 52, 38, .12);
      }
      h1 { margin: 0 0 .5rem; font-size: 1.35rem; }
      p { margin: 0; line-height: 1.55; color: #6f4e37; }
    </style>
  </head>
  <body>
    <main>
      <h1>Connection unavailable</h1>
      <p>Mizantra ERP needs a network connection for live transactions. Reconnect and refresh to continue safely.</p>
    </main>
  </body>
</html>
